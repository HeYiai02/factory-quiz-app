<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工厂TCN系统与应急响应复习平台</title>
    <!-- 引入样式与依赖库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">


    <!-- 登录界面 -->
    <div id="loginView" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
            <div class="text-center mb-6">
                <i class="fa-solid fa-industry text-4xl text-indigo-600 mb-2"></i>
                <h2 class="text-2xl font-bold">工厂知识点考核平台</h2>
                <p class="text-xs text-slate-400 mt-1">请输入您的工号登录系统</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">员工工号</label>
                    <input type="text" id="empIdInput" placeholder="例如：1001" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                </div>
                <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">登录平台</button>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainView" class="hidden">
        <header class="bg-indigo-700 text-white sticky top-0 z-50 shadow-md">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                    <span class="font-bold">工厂知识点考核平台</span>
                </div>
                <div class="flex items-center gap-4 text-sm">
                    <span>欢迎，<strong id="userInfo">--</strong></span>
                    <button onclick="logout()" class="text-xs bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-600">退出</button>
                </div>
            </div>
        </header>

        <!-- 导航 Tab -->
        <nav class="bg-white border-b border-slate-200 sticky top-[52px] z-40">
            <div class="max-w-6xl mx-auto px-4 flex gap-6 text-sm font-medium">
                <button onclick="switchTab('review')" id="tab-review" class="py-3 border-b-2 border-indigo-600 text-indigo-600">题库复习</button>
                <button onclick="switchTab('quiz')" id="tab-quiz" class="py-3 text-slate-500 hover:text-indigo-600">随机自测</button>
                <button onclick="switchTab('exam')" id="tab-exam" class="py-3 text-slate-500 hover:text-indigo-600">在线考试</button>
                <button onclick="switchTab('admin')" id="tab-admin" class="hidden py-3 text-amber-600 hover:text-amber-700 font-bold"><i class="fa-solid fa-screwdriver-wrench mr-1"></i>管理组卷</button>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto px-4 py-6">
            <!-- 视图 1：题库复习 -->
            <section id="view-review" class="space-y-4">
                <div class="bg-white p-4 rounded-xl border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex gap-2">
                        <button id="btnRecite" onclick="setReviewMode('recite')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white">背题模式</button>
                        <button id="btnQuiz" onclick="setReviewMode('self')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600">刷题模式</button>
                    </div>
                    <input type="text" id="reviewSearch" oninput="renderReviewQuestions()" placeholder="搜索关键词..." class="px-3 py-1.5 border rounded-lg text-xs w-full md:w-64">
                </div>
                <div id="reviewContainer" class="space-y-3"></div>
            </section>

            <!-- 视图 2：随机自测 -->
            <section id="view-quiz" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-xl border border-slate-200 flex justify-between items-center">
                    <span class="text-sm font-bold">随机抽取 10 道题目</span>
                    <button onclick="generateRandomQuiz()" class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-medium">重新抽题</button>
                </div>
                <div id="quizContainer" class="space-y-3"></div>
            </section>

            <!-- 视图 3：在线考试与 PDF 导出 -->
            <section id="view-exam" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-xl border border-slate-200">
                    <h3 class="text-sm font-bold mb-3">当前可用试卷列表</h3>
                    <div id="examList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                </div>
                <div id="paperArea" class="hidden bg-white p-8 rounded-xl border border-slate-200 space-y-6">
                    <div class="flex justify-between items-center border-b pb-4">
                        <div>
                            <h2 id="paperTitle" class="text-xl font-bold">试卷标题</h2>
                            <p class="text-xs text-slate-500 mt-1" id="paperMeta">考生工号：-- | 姓名：--</p>
                        </div>
                        <button onclick="exportPDF()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-emerald-700">导出PDF答卷</button>
                    </div>
                    <div id="paperQuestions" class="space-y-6"></div>
                </div>
            </section>

            <!-- 视图 4：管理员自由组卷 -->
            <section id="view-admin" class="hidden space-y-4">
                <div class="bg-white p-6 rounded-xl border border-slate-200 space-y-4">
                    <h3 class="text-base font-bold text-amber-700">创建新试卷</h3>
                    <input type="text" id="newExamTitle" placeholder="输入新试卷名称（例如：2026年第四季度TCN安全考核）" class="w-full px-3 py-2 border rounded-lg text-sm">
                    <div>
                        <span class="text-xs font-semibold block mb-2 text-slate-600">勾选试卷包含的题目：</span>
                        <div id="adminQuestionSelect" class="max-h-96 overflow-y-auto border rounded-lg p-3 space-y-2 bg-slate-50"></div>
                    </div>
                    <button onclick="createExam()" class="bg-amber-600 text-white px-6 py-2 rounded-lg text-sm font-semibold hover:bg-amber-700">发布试卷</button>
                </div>
            </section>
        </main>
    </div>

    <script>
// 1. 【必须放在最顶部】声明全局变量
    let db = null;
    let currentUser = null;
    let allQuestions = [];
    let reviewMode = 'recite';

    // 2. 初始化系统与 Supabase 客户端
    async function initSystem() {
        try {
            const response = await fetch('/api/config');
            const config = await response.json();
            
            // 注意：这里不要加 const 或 let，直接给外层的全局变量 db 赋值
            db = supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);
            console.log("Supabase 初始化成功");
        } catch (error) {
            console.error("无法加载系统配置:", error);
            alert("系统配置加载失败，请检查 Cloudflare 环境变量设置。");
        }
    }

    // 页面加载完成后立即执行初始化
    window.addEventListener('DOMContentLoaded', initSystem);

    // 3. 登录逻辑
    async function handleLogin() {
        // 增加防御性校验：如果 API 还在请求中，提示用户稍等
        if (!db) {
            return alert('系统配置正在加载中，请稍等 1~2 秒后重试登录...');
        }

        const empId = document.getElementById('empIdInput').value.trim();
        if (!empId) return alert('请输入工号');

        const { data, error } = await db.from('users').select('*').eq('emp_id', empId).single();
        if (error || !data) return alert('工号不存在，请联系管理员！');

        currentUser = data;
        document.getElementById('userInfo').innerText = `${currentUser.name} (${currentUser.role === 'admin' ? '管理员' : '员工'})`;
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('mainView').classList.remove('hidden');

        if (currentUser.role === 'admin') {
            document.getElementById('tab-admin').classList.remove('hidden');
        }

        await loadQuestions();
    }

        function logout() { location.reload(); }

        // 加载题库
        async function loadQuestions() {
            const { data } = await db.from('questions').select('*');
            allQuestions = data || [];
            renderReviewQuestions();
            renderAdminSelect();
            loadExamList();
        }

        // Tab 切换
        function switchTab(tab) {
            ['review', 'quiz', 'exam', 'admin'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                const tabBtn = document.getElementById(`tab-${t}`);
                if (tabBtn) tabBtn.className = "py-3 text-slate-500 hover:text-indigo-600";
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            const activeTab = document.getElementById(`tab-${tab}`);
            if (activeTab) activeTab.className = "py-3 border-b-2 border-indigo-600 text-indigo-600 font-bold";
        }

        // 视图 1：背题/刷题渲染
        function setReviewMode(m) { reviewMode = m; renderReviewQuestions(); }
        function renderReviewQuestions() {
            const kw = document.getElementById('reviewSearch').value.toLowerCase();
            const container = document.getElementById('reviewContainer');
            const list = allQuestions.filter(q => q.question.toLowerCase().includes(kw) || q.answer.toLowerCase().includes(kw));

            container.innerHTML = list.map((q, idx) => `
                <div class="bg-white p-4 rounded-xl border border-slate-200">
                    <div class="text-xs text-indigo-600 font-semibold mb-1">[${q.source}] ${q.type}</div>
                    <div class="font-medium text-sm text-slate-800">${idx+1}. ${q.question}</div>
                    ${reviewMode === 'recite' ? 
                        `<div class="mt-2 p-2 bg-amber-50 text-amber-900 rounded text-xs border border-amber-200">标答：${q.answer}</div>` : 
                        `<details class="mt-2 text-xs text-slate-400"><summary class="cursor-pointer text-indigo-600">点击查看答案</summary><div class="mt-1 text-slate-700">${q.answer}</div></details>`}
                </div>
            `).join('');
        }

        // 视图 2：随机自测
        function generateRandomQuiz() {
            const shuffled = [...allQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
            const container = document.getElementById('quizContainer');
            container.innerHTML = shuffled.map((q, idx) => `
                <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-2">
                    <div class="font-medium text-sm">${idx+1}. ${q.question}</div>
                    <textarea placeholder="在此填写你的答案..." class="w-full border p-2 rounded text-xs h-16"></textarea>
                    <details class="text-xs text-slate-400"><summary class="cursor-pointer text-indigo-600">对照标准答案</summary><div class="mt-1 text-emerald-700 font-medium">${q.answer}</div></details>
                </div>
            `).join('');
        }

        // 视图 3：在线考试
        async function loadExamList() {
            const { data } = await db.from('exams').select('*');
            const container = document.getElementById('examList');
            container.innerHTML = (data || []).map(e => `
                <div class="border p-4 rounded-xl flex justify-between items-center bg-slate-50">
                    <div>
                        <div class="font-bold text-sm text-slate-800">${e.title}</div>
                        <div class="text-xs text-slate-400">题目数：${e.question_ids.length} 题</div>
                    </div>
                    <button onclick="startExam('${e.title}', ${JSON.stringify(e.question_ids)})" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs">开始答题</button>
                </div>
            `).join('');
        }

        function startExam(title, qIds) {
            document.getElementById('paperArea').classList.remove('hidden');
            document.getElementById('paperTitle').innerText = title;
            document.getElementById('paperMeta').innerText = `考生工号：${currentUser.emp_id} | 姓名：${currentUser.name} | 日期：${new Date().toLocaleDateString()}`;
            
            const examQs = allQuestions.filter(q => qIds.includes(q.id));
            document.getElementById('paperQuestions').innerHTML = examQs.map((q, idx) => `
                <div class="space-y-2 border-b pb-4">
                    <div class="font-medium text-sm">${idx+1}. [${q.type}] ${q.question}</div>
                    <textarea placeholder="答题区域..." class="w-full border p-2 rounded text-xs h-20"></textarea>
                </div>
            `).join('');
        }

        function exportPDF() {
            const element = document.getElementById('paperArea');
            html2pdf().set({ margin: 10, filename: `考试答卷_${currentUser.name}.pdf` }).from(element).save();
        }

        // 视图 4：管理员组卷
        function renderAdminSelect() {
            const container = document.getElementById('adminQuestionSelect');
            container.innerHTML = allQuestions.map(q => `
                <label class="flex items-center gap-2 text-xs bg-white p-2 rounded border cursor-pointer">
                    <input type="checkbox" value="${q.id}" class="exam-q-check">
                    <span class="font-bold text-slate-500">[${q.type}]</span>
                    <span class="truncate">${q.question}</span>
                </label>
            `).join('');
        }

        async function createExam() {
            const title = document.getElementById('newExamTitle').value.trim();
            const checkedBoxes = document.querySelectorAll('.exam-q-check:checked');
            const qIds = Array.from(checkedBoxes).map(cb => parseInt(cb.value));

            if (!title) return alert('请输入试卷名称');
            if (qIds.length === 0) return alert('请至少选择一道题目');

            const { error } = await db.from('exams').insert([{ title, question_ids: qIds }]);
            if (error) return alert('发布失败：' + error.message);

            alert('试卷发布成功！');
            document.getElementById('newExamTitle').value = '';
            loadExamList();
            switchTab('exam');
        }
    </script>
</body>
</html>
