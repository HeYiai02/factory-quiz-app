<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 👈 1. 禁用手机端缩放限制，固定 1.0 比例，提升 App 级手感 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工厂知识点考核平台</title>
    <!-- 引入样式与第三方依赖库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- 👈 2. CSS 彻底锁定手势与双击缩放 -->
    <style>
        html, body {
            touch-action: manipulation; /* 禁用手势双击放大 */
            -webkit-text-size-adjust: 100%;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen select-none">

    <!-- 1. 登录界面 -->
    <div id="loginView" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
            <div class="text-center mb-6">
                <i class="fa-solid fa-industry text-4xl text-indigo-600 mb-2"></i>
                <h2 class="text-2xl font-bold">工厂知识点考核平台</h2>
                <p class="text-xs text-slate-400 mt-1">请输入您的工号登录系统</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">员工工号</label>
                    <input type="text" id="empIdInput" placeholder="例：0038***" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                </div>
                <button id="loginBtn" onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition flex items-center justify-center gap-2">
                    登录平台
                </button>
            </div>
        </div>
    </div>

    <!-- 2. 主界面 -->
    <div id="mainView" class="hidden">
        <header class="bg-indigo-700 text-white sticky top-0 z-50 shadow-md">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                    <span class="font-bold">工厂知识点考核平台</span>
                </div>
                <div class="flex items-center gap-4 text-sm">
                    <span>欢迎，<strong id="userInfo">--</strong></span>
                    <button onclick="logout()" class="text-xs bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-600">退出</button>
                </div>
            </div>
        </header>

        <!-- 一级导航 Tab -->
        <nav class="bg-white border-b border-slate-200 sticky top-[52px] z-40">
            <div class="max-w-6xl mx-auto px-4 flex gap-6 text-sm font-medium">
                <button onclick="switchTab('review')" id="tab-review" class="py-3 border-b-2 border-indigo-600 text-indigo-600 font-bold">题库复习</button>
                <button onclick="switchTab('quiz')" id="tab-quiz" class="py-3 text-slate-500 hover:text-indigo-600">随机自测</button>
                <button onclick="switchTab('exam')" id="tab-exam" class="py-3 text-slate-500 hover:text-indigo-600">在线考试</button>
                <button onclick="switchTab('admin')" id="tab-admin" class="hidden py-3 text-amber-600 hover:text-amber-700 font-bold"><i class="fa-solid fa-screwdriver-wrench mr-1"></i>管理控制台</button>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto px-4 py-6">
            <!-- 视图 1：题库复习 -->
                <section id="view-review" class="space-y-4">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3 shadow-sm">
                        <!-- 模式切换与数量统计 -->
                        <div class="flex flex-wrap justify-between items-center gap-3">
                            <div class="flex gap-2">
                                <button id="btnRecite" onclick="setReviewMode('recite')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow-sm transition">背题模式</button>
                                <button id="btnQuiz" onclick="setReviewMode('self')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">刷题模式</button>
                            </div>
                            <div class="text-xs text-slate-500">
                                当前筛选：共 <strong id="reviewCount" class="text-indigo-600 font-bold text-sm">0</strong> 道题
                            </div>
                        </div>

                        <!-- 三维动态筛选工具栏 -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 pt-1 border-t border-slate-100">
                            <!-- 来源下拉菜单：自动动态生成 -->
                            <select id="reviewSourceSelect" onchange="renderReviewQuestions()" class="p-2 border border-slate-200 rounded-lg text-xs bg-slate-50 text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="all">所有试卷来源 (全部)</option>
                            </select>

                            <!-- 题型下拉菜单 -->
                            <select id="reviewTypeSelect" onchange="renderReviewQuestions()" class="p-2 border border-slate-200 rounded-lg text-xs bg-slate-50 text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="all">所有题型 (全部)</option>
                                <option value="填空题">填空题</option>
                                <option value="选择题">选择题</option>
                                <option value="判断题">判断题</option>
                                <option value="简答题">简答题</option>
                            </select>

                            <!-- 搜索框 -->
                            <input type="text" id="reviewSearch" oninput="renderReviewQuestions()" placeholder="搜索题目或答案关键字..." class="p-2 border border-slate-200 rounded-lg text-xs bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>

                    <div id="reviewContainer" class="space-y-3"></div>
                </section>

            <!-- 视图 2：随机自测 -->
            <section id="view-quiz" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-xl border border-slate-200 flex justify-between items-center">
                    <span class="text-sm font-bold">随机抽取 10 道题目</span>
                    <button onclick="generateRandomQuiz()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium">重新抽题</button>
                </div>
                <div id="quizContainer" class="space-y-3"></div>
            </section>

            <!-- 视图 3：在线考试 -->
            <section id="view-exam" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-xl border border-slate-200">
                    <h3 class="text-sm font-bold mb-3">当前可用试卷列表</h3>
                    <div id="examList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                </div>
                <div id="paperArea" class="hidden bg-white p-8 rounded-xl border border-slate-200 space-y-6">
                    <div class="flex justify-between items-center border-b pb-4">
                        <div>
                            <h2 id="paperTitle" class="text-xl font-bold">试卷标题</h2>
                            <p class="text-xs text-slate-500 mt-1" id="paperMeta">考生工号：-- | 姓名：--</p>
                        </div>
                        <button onclick="exportPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-semibold">导出PDF答卷</button>
                    </div>
                    <div id="paperQuestions" class="space-y-6"></div>
                </div>
            </section>

            <!-- 视图 4：管理员控制台（题库 CRUD + 试卷组卷） -->
            <section id="view-admin" class="hidden space-y-4">
                <!-- 管理员二级导航 -->
                <div class="flex gap-4 border-b border-slate-200 pb-2">
                    <button onclick="switchAdminSubTab('manage')" id="adminTab-manage" class="font-bold text-sm text-amber-700 border-b-2 border-amber-600 pb-2">
                        <i class="fa-solid fa-list-check mr-1"></i> 题库 CRUD 管理
                    </button>
                    <button onclick="switchAdminSubTab('build')" id="adminTab-build" class="font-medium text-sm text-slate-500 hover:text-amber-700 pb-2">
                        <i class="fa-solid fa-file-circle-plus mr-1"></i> 试卷组卷发布
                    </button>
                </div>

                <!-- 板块 1：题库 CRUD 管理 -->
                <div id="adminSubView-manage" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                    <div class="flex justify-between items-center border-b pb-4">
                        <div>
                            <h3 class="text-base font-bold text-slate-800">题目管理列表</h3>
                            <p class="text-xs text-slate-400 mt-1">支持直接新增、编辑修改题目内容及上传附图</p>
                        </div>
                        <button onclick="openQuestionModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-plus"></i> 新增题目
                        </button>
                    </div>

                    <!-- 组卷同款三维筛选栏 -->
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2 text-xs">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                            <select id="adminManageSourceSelect" onchange="renderAdminManageList()" class="w-full p-2 border rounded-md bg-white text-slate-700">
                                <option value="all">所有试卷来源</option>
                                <option value="TCN后备相关考核">TCN后备相关考核</option>
                                <option value="应急响应相关考核">应急响应相关考核</option>
                                <option value="TCN相关考核">TCN相关考核</option>
                            </select>
                            <select id="adminManageTypeSelect" onchange="renderAdminManageList()" class="w-full p-2 border rounded-md bg-white text-slate-700">
                                <option value="all">所有题型</option>
                                <option value="填空题">填空题</option>
                                <option value="选择题">选择题</option>
                                <option value="判断题">判断题</option>
                                <option value="简答题">简答题</option>
                            </select>
                        </div>
                        <input type="text" id="adminManageSearch" oninput="renderAdminManageList()" placeholder="搜索题目关键字..." class="w-full p-2 border rounded-md bg-white outline-none">
                    </div>

                    <div id="adminManageList" class="space-y-2 max-h-[500px] overflow-y-auto"></div>
                </div>

                <!-- 板块 2：试卷组卷发布 -->
                <div id="adminSubView-build" class="hidden">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <div class="flex flex-col md:flex-row justify-between md:items-center gap-4 border-b pb-4">
                            <div>
                                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                                    <i class="fa-solid fa-file-circle-plus text-amber-600"></i> 创建新试卷
                                </h3>
                                <p class="text-xs text-slate-400 mt-1">筛选题目并勾选，右侧可实时预览生成后的试卷效果</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-lg text-xs">
                                    已选 <strong id="adminSelectedCount" class="text-amber-700 text-sm">0</strong> 题
                                    <span id="adminSelectedDetail" class="text-slate-400 ml-1">(填空 0 | 选择 0 | 简答 0)</span>
                                </div>
                                <button onclick="toggleAdminPreview()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1">
                                    <i class="fa-solid fa-eye"></i> <span id="btnPreviewText">隐藏预览</span>
                                </button>
                                <button onclick="createExam()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 shadow-sm">
                                    <i class="fa-solid fa-paper-plane"></i> 发布试卷
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div class="md:col-span-1">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">试卷标题 <span class="text-red-500">*</span></label>
                                <input type="text" id="newExamTitle" placeholder="例如：2026年第四季度TCN安全考核" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">考试开始时间 <span class="text-red-500">*</span></label>
                                <input type="datetime-local" id="newExamStart" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-700 focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">考试结束时间 <span class="text-red-500">*</span></label>
                                <input type="datetime-local" id="newExamEnd" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-700 focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 pt-2">
                            <div id="adminSelectorCol" class="lg:col-span-7 space-y-3">
                                <div class="text-xs font-bold text-slate-700 flex justify-between items-center">
                                    <span>选择题目</span>
                                    <div class="space-x-2">
                                        <button onclick="selectAllFiltered(true)" class="text-indigo-600 hover:underline">勾选当前筛选</button>
                                        <span class="text-slate-300">|</span>
                                        <button onclick="clearAllSelected()" class="text-rose-600 hover:underline">清空已选</button>
                                    </div>
                                </div>

                                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2 text-xs">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                        <select id="adminSourceSelect" onchange="renderAdminSelect()" class="w-full p-2 border rounded-md bg-white text-slate-700">
                                            <option value="all">所有试卷来源</option>
                                            <option value="TCN后备相关考核">TCN后备相关考核</option>
                                            <option value="应急响应相关考核">应急响应相关考核</option>
                                            <option value="TCN相关考核">TCN相关考核</option>
                                        </select>
                                        <select id="adminTypeSelect" onchange="renderAdminSelect()" class="w-full p-2 border rounded-md bg-white text-slate-700">
                                            <option value="all">所有题型</option>
                                            <option value="填空题">填空题</option>
                                            <option value="选择题">选择题</option>
                                            <option value="判断题">判断题</option>
                                            <option value="简答题">简答题</option>
                                        </select>
                                    </div>
                                    <input type="text" id="adminSearchKw" oninput="renderAdminSelect()" placeholder="搜索题目关键字..." class="w-full p-2 border rounded-md bg-white outline-none">
                                </div>

                                <div id="adminQuestionSelect" class="max-h-[480px] overflow-y-auto border rounded-lg p-3 space-y-2 bg-white"></div>
                            </div>

                            <div id="adminPreviewCol" class="lg:col-span-5 border-t lg:border-t-0 lg:border-l border-slate-200 lg:pl-6 space-y-3">
                                <div class="text-xs font-bold text-slate-700 flex justify-between items-center">
                                    <span>试卷卷面预览</span>
                                    <span class="text-slate-400 font-normal">点击右上角 ❌ 可踢出此题</span>
                                </div>
                                <div id="adminPreviewContainer" class="max-h-[520px] overflow-y-auto border border-amber-200/60 rounded-lg p-4 bg-amber-50/20 space-y-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 3. 题目新增/编辑 Modal 弹窗 -->
    <div id="questionModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-xl border border-slate-200 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modalTitle" class="font-bold text-base text-slate-800">新增题目</h3>
                <button onclick="closeQuestionModal()" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
            </div>

            <input type="hidden" id="editQId">

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1">所属试卷/模块</label>
                    <input type="text" id="formSource" placeholder="例如：TCN相关考核" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block font-semibold mb-1">题目类型</label>
                    <select id="formType" onchange="toggleFormOptions()" class="w-full p-2 border rounded-lg outline-none bg-white">
                        <option value="填空题">填空题</option>
                        <option value="选择题">选择题</option>
                        <option value="判断题">判断题</option>
                        <option value="简答题">简答题</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-1">题目描述</label>
                    <textarea id="formQuestion" placeholder="输入题目内容..." class="w-full p-2 border rounded-lg outline-none h-20 focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div id="formOptionsArea" class="hidden space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div class="flex justify-between items-center">
                        <label class="block font-semibold text-slate-700">选择题选项</label>
                        <button type="button" onclick="addOptionInputRow('')" class="text-indigo-600 hover:text-indigo-800 text-xs font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> 添加选项
                        </button>
                    </div>
                    <div id="formOptionsList" class="space-y-2"></div>
                </div>

                <div>
                    <label class="block font-semibold mb-1">标准答案</label>
                    <textarea id="formAnswer" placeholder="输入标准答案..." class="w-full p-2 border rounded-lg outline-none h-16 focus:ring-2 focus:ring-indigo-500"></textarea>
                    
                    <div id="formAnswerJudgmentArea" class="hidden gap-6 p-3 bg-slate-50 border border-slate-200 rounded-xl">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="judgmentAnswerRadio" value="正确" class="text-indigo-600 focus:ring-indigo-500" checked>
                            <span class="font-semibold text-emerald-700">正确 (对)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="judgmentAnswerRadio" value="错误" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="font-semibold text-rose-700">错误 (错)</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold mb-1">题目附图 (可选)</label>
                    <input type="file" id="formImageFile" accept="image/*" class="w-full p-1 border rounded-lg text-xs">
                    <div id="currentImagePreview" class="mt-2 hidden">
                        <span class="text-[10px] text-slate-400 block mb-1">已有图片（点击可预览大图）：</span>
                        <img id="previewImgSrc" src="" onclick="previewImage(this.src)" class="h-24 rounded border object-contain bg-slate-50 cursor-pointer hover:opacity-80 transition">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t">
                <button onclick="closeQuestionModal()" class="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600">取消</button>
                <button onclick="saveQuestionSubmit()" id="btnSaveQ" class="px-4 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">保存题目</button>
            </div>
        </div>
    </div>

    <!-- 👈 4. 全局图片放大预览 Modal (点击图片弹窗全屏大图) -->
    <div id="imagePreviewModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 cursor-zoom-out" onclick="closeImagePreview()">
        <div class="relative max-w-4xl max-h-[90vh] w-full flex items-center justify-center" onclick="event.stopPropagation()">
            <img id="imagePreviewTarget" src="" class="max-h-[85vh] max-w-full rounded-lg shadow-2xl object-contain bg-slate-900/50">
            <button onclick="closeImagePreview()" class="absolute -top-10 right-0 text-white hover:text-slate-300 text-lg font-bold bg-black/40 px-3 py-1 rounded-full border border-white/20">✕ 关闭</button>
        </div>
    </div>

    <!-- 5. 加载 JS 模块 -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/review.js"></script>
    <script src="js/exam.js"></script>
    <script src="js/admin.js"></script>

    <script>
        // JS 彻底拦截 iOS Safari 的双指与双击放大行为
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
